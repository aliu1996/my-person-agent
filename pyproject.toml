[project]
name = "personal-assistant-workspace"
version = "0.1.0"
description = "个人工作助手服务端 Monorepo"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
  "packages/pa-shared",
  "services/chat-api",
  "services/chat-stream",
  "services/worker",
  "services/search-service",
]

[tool.uv.sources]
pa-shared = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
