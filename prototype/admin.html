<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人工作助手 · 管理后台原型（含 M18 模型管理）</title>
  <link rel="stylesheet" href="./tokens.css" />
  <style>
    body { height: 100vh; overflow: hidden; display: flex; background: var(--bg-base); }
    .admin-sb { width: 230px; background: var(--bg-surface); border-right: 1px solid var(--border-default); display: flex; flex-direction: column; padding: 16px 12px; gap: 6px; flex-shrink: 0; }
    .admin-brand { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 14px; font-weight: 600; font-size: 14px; }
    .menu-group { font-size: 11px; color: var(--text-tertiary); padding: 10px 10px 4px; }
    .menu-item { padding: 8px 10px; border-radius: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .menu-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .menu-item.active { background: var(--bg-elevated); color: var(--text-primary); font-weight: 500; border: 1px solid var(--border-default); }

    .admin-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .admin-top { height: 54px; border-bottom: 1px solid var(--border-default); padding: 0 28px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .admin-body { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; }

    .card { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th, .tbl td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-default); }
    .tbl th { color: var(--text-tertiary); font-weight: 500; font-size: 12px; }
    .tbl tr:last-child td { border-bottom: none; }

    .seg-tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 10px; background: var(--bg-surface); border: 1px solid var(--border-default); }
    .seg-tab { padding: 6px 14px; border-radius: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
    .seg-tab.active { background: var(--bg-elevated); color: var(--text-primary); font-weight: 500; }

    .field-input, .field-select { width: 100%; height: 36px; border-radius: 8px; background: var(--bg-base); border: 1px solid var(--border-default); padding: 0 10px; color: var(--text-primary); font-family: inherit; font-size: 13px; outline: none; }
    .field-input:focus { border-color: var(--accent-primary); }

    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 60; }
    .modal-mask.open { display: flex; }
    .modal-box { background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 16px; width: 520px; max-width: 92vw; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }

    .toast-box { position: fixed; top: 18px; right: 20px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
    .toast { background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 10px; padding: 9px 14px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <aside class="admin-sb">
    <div class="admin-brand">
      <span>运营管理后台</span>
      <span class="badge badge-neutral" style="font-size:11px;">超管</span>
    </div>
    <div class="menu-group">核心配置</div>
    <div class="menu-item active" data-p="models" onclick="switchPage('models', this)"><span>M18 模型管理</span><span class="badge badge-accent" style="font-size:10px;">P0</span></div>
    <div class="menu-item" data-p="points" onclick="switchPage('points', this)"><span>积分规则配置</span></div>
    <div class="menu-group">安全与运营</div>
    <div class="menu-item" data-p="audit" onclick="switchPage('audit', this)"><span>内容审核队列</span><span class="badge badge-warning" style="font-size:10px;">2</span></div>
    <div class="menu-item" data-p="users" onclick="switchPage('users', this)"><span>用户与配额</span></div>
    <div class="menu-item" data-p="logs" onclick="switchPage('logs', this)"><span>变更审计日志</span></div>

    <div style="margin-top:auto;padding-top:12px;border-top:1px solid var(--border-default);display:flex;flex-direction:column;gap:8px;font-size:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:0 6px;">
        <span style="color:var(--text-secondary);">admin@ops · 2FA 已启用</span>
        <span style="cursor:pointer;color:var(--text-secondary);" onclick="toggleTheme()" title="切换深浅色">☀</span>
      </div>
      <div style="display:flex;gap:8px;padding:0 6px;">
        <a href="./index.html" style="color:var(--accent-primary);text-decoration:none;">用户端原型 ↗</a>
        <a href="./mobile.html" style="color:var(--text-tertiary);text-decoration:none;">手机端 ↗</a>
      </div>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-top">
      <strong id="pageTitle" style="font-size:15px;">M18 · 模型与网关管理</strong>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="badge badge-success" style="font-size:11px;">Higress AI 网关 · xDS 已同步</span>
        <button class="btn btn-secondary btn-sm" onclick="showToast('已触发 Higress 全量配置同步（30 秒内生效）','success')">立即下发配置</button>
      </div>
    </header>

    <div class="admin-body" id="adminBody"></div>
  </main>

  <!-- 在线试聊弹窗 -->
  <div class="modal-mask" id="testChatModal" onclick="if(event.target===this)closeModal('testChatModal')">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;"><strong id="tcTitle">在线试聊验证</strong><span style="cursor:pointer;color:var(--text-tertiary);" onclick="closeModal('testChatModal')">✕</span></div>
      <div id="tcOut" style="background:var(--bg-base);border:1px solid var(--border-default);border-radius:10px;padding:12px;font-size:13px;min-height:90px;color:var(--text-secondary);">点击发送测试消息，直接经 Higress AI 网关验证延迟与输出...</div>
      <div style="display:flex;gap:8px;">
        <input class="field-input" id="tcIn" value="你好，请用一句话介绍你自己。" />
        <button class="btn btn-primary" onclick="runTestChat()">发送</button>
      </div>
    </div>
  </div>

  <!-- 新增供应商弹窗 -->
  <div class="modal-mask" id="provModal" onclick="if(event.target===this)closeModal('provModal')">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;"><strong>新增模型供应商</strong><span style="cursor:pointer;color:var(--text-tertiary);" onclick="closeModal('provModal')">✕</span></div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <input class="field-input" id="pName" placeholder="供应商名称（如：自建机房 vLLM-2）" />
        <input class="field-input" id="pUrl" placeholder="Base URL（如：http://10.0.0.8:8000/v1）" />
        <input class="field-input" id="pKey" type="password" placeholder="API Key（加密存储，保存后仅显示掩码）" />
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn btn-secondary btn-sm" onclick="closeModal('provModal')">取消</button>
        <button class="btn btn-primary btn-sm" onclick="addProvider()">保存并下发</button>
      </div>
    </div>
  </div>

  <div class="toast-box" id="toastBox"></div>

  <script>
    let curPage = 'models';
    let modelTab = 'models';

    const providers = [
      { id: 'p1', name: 'DeepSeek 官方', type: '公有云 API', url: 'https://api.deepseek.com/v1', keys: 'sk-****9a21 (3 个轮询)', status: '正常 · 320ms' },
      { id: 'p2', name: '通义千问 DashScope', type: '公有云 API', url: 'https://dashscope.aliyuncs.com/compatible-mode/v1', keys: 'sk-****4f08 (2 个轮询)', status: '正常 · 280ms' },
      { id: 'p3', name: '自建 GPU 集群 (vLLM)', type: '内网自建', url: 'http://10.0.0.5:8000/v1', keys: 'internal-****01', status: '正常 · 45ms' },
    ];

    const models = [
      { code: 'ds-r1', name: 'DeepSeek-R1', provider: 'DeepSeek 官方', caps: ['深度思考', '工具'], mult: '4 / 0.4 / 16', scope: '全部用户', fallback: 'ds-v3', status: '上线', refs: 1240 },
      { code: 'ds-v3', name: 'DeepSeek-V3', provider: 'DeepSeek 官方', caps: ['工具', '快速'], mult: '1 / 0.1 / 2', scope: '全部用户', fallback: 'qwen-plus', status: '上线', refs: 8420 },
      { code: 'qwen-vl', name: 'Qwen-VL-Max', provider: '通义千问 DashScope', caps: ['视觉', '长上下文'], mult: '3 / 0.3 / 9', scope: '全部用户', fallback: 'ds-v3', status: '灰度 30%', refs: 310 },
      { code: 'guard-7b', name: 'Qwen3Guard-7B', provider: '自建 GPU 集群 (vLLM)', caps: ['内容审核'], mult: '平台成本', scope: '仅系统内部', fallback: '—', status: '上线', refs: 1 },
    ];

    const bindings = [
      ['快路径默认对话', 'ds-v3'],
      ['Agent 回合默认', 'ds-r1'],
      ['会话标题与摘要', 'ds-v3'],
      ['自动记忆提取', 'ds-v3'],
      ['路由意图判定', 'ds-v3'],
      ['多模态识图', 'qwen-vl'],
      ['内容安全审核', 'guard-7b'],
    ];

    const auditLogs = [
      ['11-17 10:35', 'admin@ops', '更新模型 ds-r1 输出倍率为 16（已同步 Higress）'],
      ['11-17 09:12', 'admin@ops', '新增内网供应商 自建 GPU 集群 (vLLM)，API Key 已加密'],
    ];

    function switchPage(p, el) {
      curPage = p;
      document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
      if (el) el.classList.add('active');
      const titles = {
        models: 'M18 · 模型与网关管理',
        points: 'M14 · 积分规则配置',
        audit: 'M17 · 内容审核复审队列',
        users: 'M16 · C 端用户与积分管理',
        logs: '配置变更审计日志',
      };
      document.getElementById('pageTitle').textContent = titles[p];
      renderPage();
    }

    function renderPage() {
      const b = document.getElementById('adminBody');
      if (curPage === 'models') {
        b.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div class="seg-tabs">
              <div class="seg-tab ${modelTab==='models'?'active':''}" onclick="modelTab='models';renderPage()">模型目录 (${models.length})</div>
              <div class="seg-tab ${modelTab==='providers'?'active':''}" onclick="modelTab='providers';renderPage()">供应商与 Key 池 (${providers.length})</div>
              <div class="seg-tab ${modelTab==='bindings'?'active':''}" onclick="modelTab='bindings';renderPage()">系统用途绑定</div>
            </div>
            <button class="btn btn-primary btn-sm" onclick="openModal('provModal')">＋ 新增供应商</button>
          </div>
          ${modelTab === 'models' ? `
            <div class="card">
              <table class="tbl">
                <thead><tr><th>model_code</th><th>显示名 / 供应商</th><th>能力标签</th><th>倍率 (入/缓/出)</th><th>降级模型</th><th>状态</th><th>操作</th></tr></thead>
                <tbody>
                  ${models.map((m, i) => `
                    <tr>
                      <td style="font-family:var(--font-mono);font-size:12px;">${m.code}</td>
                      <td><strong>${m.name}</strong><div style="font-size:11px;color:var(--text-tertiary);">${m.provider} · ${m.scope}</div></td>
                      <td>${m.caps.map(c => `<span class="badge badge-neutral" style="margin-right:4px;font-size:11px;">${c}</span>`).join('')}</td>
                      <td style="font-family:var(--font-mono);font-size:12px;">${m.mult}</td>
                      <td style="font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);">${m.fallback}</td>
                      <td><span class="badge ${m.status==='上线'?'badge-success':m.status==='下线'?'badge-danger':'badge-warning'}">${m.status}</span></td>
                      <td style="display:flex;gap:6px;">
                        <button class="btn btn-secondary btn-sm" onclick="openTestChat('${m.name}')">试聊</button>
                        <button class="btn btn-ghost btn-sm" onclick="toggleModelStatus(${i})">${m.status==='下线'?'上线':'下线'}</button>
                      </td>
                    </tr>`).join('')}
                </tbody>
              </table>
            </div>` : modelTab === 'providers' ? `
            <div class="card">
              <table class="tbl">
                <thead><tr><th>供应商名称</th><th>类型</th><th>Base URL</th><th>API Key 池</th><th>连通性</th><th>操作</th></tr></thead>
                <tbody>
                  ${providers.map((p, i) => `
                    <tr>
                      <td><strong>${p.name}</strong></td>
                      <td>${p.type}</td>
                      <td style="font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);">${p.url}</td>
                      <td style="font-family:var(--font-mono);font-size:12px;">${p.keys}</td>
                      <td><span class="badge badge-success">${p.status}</span></td>
                      <td><button class="btn btn-secondary btn-sm" onclick="showToast('${p.name} 连通性正常 (延迟 180ms，拉取到 6 个模型)','success')">测试连通</button></td>
                    </tr>`).join('')}
                </tbody>
              </table>
            </div>` : `
            <div class="card">
              <div style="font-size:13px;color:var(--text-secondary);">系统内部各环节引用的模型编码（热更新生效，无需重启）：</div>
              <table class="tbl">
                <thead><tr><th>系统用途</th><th>当前绑定 model_code</th></tr></thead>
                <tbody>
                  ${bindings.map(([u, code]) => `
                    <tr>
                      <td><strong>${u}</strong></td>
                      <td style="width:260px;">
                        <select class="field-select" onchange="showToast('${u} 已切换为 '+this.value+'，已下发 Higress','success')">
                          ${models.map(m => `<option value="${m.code}" ${m.code===code?'selected':''}>${m.code} (${m.name})</option>`).join('')}
                        </select>
                      </td>
                    </tr>`).join('')}
                </tbody>
              </table>
            </div>`}`;
      } else if (curPage === 'points') {
        b.innerHTML = `
          <div class="card" style="max-width:680px;">
            <strong>每日免费积分与非模型单价（D8 / D9）</strong>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div><div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px;">C 端每日免费积分（次日清零）</div><input class="field-input" value="1000" /></div>
              <div><div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px;">联网搜索单价（积分 / 次）</div><input class="field-input" value="2" /></div>
              <div><div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px;">沙箱执行单价（积分 / 10 秒）</div><input class="field-input" value="1" /></div>
              <div><div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px;">图片生成单价（积分 / 张）</div><input class="field-input" value="15" /></div>
            </div>
            <div><button class="btn btn-primary btn-sm" onclick="showToast('积分规则已保存并生效','success')">保存规则</button></div>
          </div>`;
      } else if (curPage === 'audit') {
        b.innerHTML = `
          <div class="card">
            <strong>待人工复审列表（自建审核模型拦截）</strong>
            <table class="tbl">
              <thead><tr><th>时间</th><th>用户</th><th>触发层</th><th>命中摘要</th><th>操作</th></tr></thead>
              <tbody>
                <tr><td>10:41</td><td>139****2011</td><td><span class="badge badge-warning">Qwen3Guard</span></td><td>疑似诱导绕过系统指令</td><td style="display:flex;gap:6px;"><button class="btn btn-secondary btn-sm" onclick="this.closest('tr').remove();showToast('已标记误判并加入训练集','info')">误判放行</button><button class="btn btn-danger btn-sm" onclick="this.closest('tr').remove();showToast('已确认违规','warning')">确认拦截</button></td></tr>
                <tr><td>09:58</td><td>137****9940</td><td><span class="badge badge-danger">敏感词 DFA</span></td><td>命中高危关键词库</td><td style="display:flex;gap:6px;"><button class="btn btn-secondary btn-sm" onclick="this.closest('tr').remove();showToast('已放行','info')">放行</button><button class="btn btn-danger btn-sm" onclick="this.closest('tr').remove();showToast('已确认违规','warning')">确认拦截</button></td></tr>
              </tbody>
            </table>
          </div>`;
      } else if (curPage === 'users') {
        b.innerHTML = `
          <div class="card">
            <table class="tbl">
              <thead><tr><th>手机号</th><th>用户类型</th><th>今日剩余积分</th><th>状态</th><th>操作</th></tr></thead>
              <tbody>
                <tr><td>138****8000</td><td>互联网 C 端</td><td>860 / 1000</td><td><span class="badge badge-success">正常</span></td><td><button class="btn btn-secondary btn-sm" onclick="showToast('已赠送 500 活动积分','success')">赠积分</button></td></tr>
                <tr><td>136****1122</td><td>互联网 C 端</td><td>0 / 1000</td><td><span class="badge badge-warning">额度耗尽</span></td><td><button class="btn btn-danger btn-sm" onclick="showToast('已封禁该账号','warning')">封禁</button></td></tr>
              </tbody>
            </table>
          </div>`;
      } else {
        b.innerHTML = `
          <div class="card">
            <table class="tbl">
              <thead><tr><th>时间</th><th>操作人</th><th>变更详情（Key 仅记录已变更）</th></tr></thead>
              <tbody>${auditLogs.map(([t, u, d]) => `<tr><td>${t}</td><td>${u}</td><td>${d}</td></tr>`).join('')}</tbody>
            </table>
          </div>`;
      }
    }

    function toggleModelStatus(i) {
      const m = models[i];
      if (m.status !== '下线') {
        if (!confirm(`模型 ${m.name} 当前有 ${m.refs} 个会话/任务引用，下线后将自动切到降级模型「${m.fallback}」，确定下线？`)) return;
        m.status = '下线';
        auditLogs.unshift(['刚刚', 'admin@ops', `下线模型 ${m.code}，已自动迁移至 ${m.fallback}`]);
      } else {
        m.status = '上线';
      }
      renderPage();
      showToast('模型状态已更新并同步 Higress', 'success');
    }

    function openTestChat(name) {
      document.getElementById('tcTitle').textContent = `在线试聊 · ${name}`;
      document.getElementById('tcOut').textContent = '点击发送测试消息，直接经 Higress AI 网关验证延迟与输出...';
      openModal('testChatModal');
    }
    function runTestChat() {
      const out = document.getElementById('tcOut');
      out.innerHTML = `<strong style="color:var(--text-primary);">模型响应（首字延迟 210ms · 消耗 24 tokens）：</strong><div style="margin-top:6px;">你好！我是个人工作助手的模型后端，当前经 Higress AI 网关连接正常。</div>`;
    }
    function addProvider() {
      const n = document.getElementById('pName').value.trim();
      const u = document.getElementById('pUrl').value.trim();
      if (!n || !u) return showToast('请填写名称和 Base URL', 'warning');
      providers.push({ id: 'p_' + Date.now(), name: n, type: '自定义', url: u, keys: 'sk-****new (1 个)', status: '待测试' });
      closeModal('provModal');
      modelTab = 'providers';
      renderPage();
      showToast('供应商已加密保存并下发 Higress', 'success');
    }

    function toggleTheme() {
      const r = document.documentElement;
      r.getAttribute('data-theme') === 'light' ? r.removeAttribute('data-theme') : r.setAttribute('data-theme', 'light');
    }
    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    function showToast(msg, type = 'info') {
      const box = document.getElementById('toastBox');
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = `<span style="color:${type==='success'?'var(--color-success)':type==='warning'?'var(--color-warning)':'var(--color-info)'}">•</span><span>${msg}</span>`;
      box.appendChild(t);
      setTimeout(() => t.remove(), 2800);
    }

    renderPage();
  </script>
</body>
</html>
