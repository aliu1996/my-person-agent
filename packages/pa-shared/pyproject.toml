[project]
name = "pa-shared"
version = "0.1.0"
description = "个人工作助手公共库（配置、响应、安全、SSE、可选DB）"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pyjwt>=2.8.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
db = [
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
]
gateway = ["httpx>=0.27.0", "redis>=5.0.0"]
storage = ["boto3>=1.35.99"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pa_shared"]
