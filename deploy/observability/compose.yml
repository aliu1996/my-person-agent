services:
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:9090:9090"
  grafana:
    image: grafana/grafana:12.1.1
    volumes:
      - ./datasources.yml:/etc/grafana/provisioning/datasources/pa.yml:ro
    ports:
      - "127.0.0.1:3000:3000"
  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/local-config.yaml"]
  alloy:
    image: grafana/alloy:v1.10.2
    command: ["run", "/etc/alloy/pa.alloy"]
    volumes:
      - ./logs.alloy:/etc/alloy/pa.alloy:ro
      - ../../logs:/var/log/pa:ro
    depends_on:
      - loki
  otel:
    image: otel/opentelemetry-collector:0.132.0
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./otel.yml:/etc/otel/config.yml:ro
    ports:
      - "127.0.0.1:4318:4318"
