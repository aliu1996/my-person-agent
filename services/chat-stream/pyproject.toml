[project]
name = "chat-stream"
version = "0.1.0"
description = "个人工作助手轻量流式接入服务"
requires-python = ">=3.11"
dependencies = [
  "pa-shared",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "redis>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_stream"]
