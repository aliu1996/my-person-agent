[project]
name = "pa-worker"
version = "0.1.0"
description = "个人工作助手 arq 异步任务服务"
requires-python = ">=3.11"
dependencies = [
  "pa-shared[db,gateway,storage]",
  "arq>=0.26.0",
  "redis>=5.0.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
