[project]
name = "chat-api"
version = "0.1.0"
description = "个人工作助手业务 API 服务"
requires-python = ">=3.11"
dependencies = [
  "pa-shared[db,gateway,storage]",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "alembic>=1.13.0",
  "arq>=0.26.0",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "pyotp>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_api"]
